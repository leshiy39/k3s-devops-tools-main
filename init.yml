---
- name: K3s lifecycle management (install / uninstall / charts)
  hosts: all
  gather_facts: true
  become: true

  vars_prompt:
    - name: ansible_become_pass
      prompt: "Enter sudo password"
      private: true

  connection: "{{ 'local' if inventory_hostname in ['localhost','127.0.0.1'] else 'ssh' }}"

  vars:
    # ------------------------------------------------------------------
    # K3S SCRIPT PATHS
    # ------------------------------------------------------------------
    k3s_online_script_local: "{{ playbook_dir }}/scripts/k3s_online.sh"
    k3s_offline_script_local: "{{ playbook_dir }}/scripts/install_k3s.sh"
    k3s_script_remote: /usr/local/bin/install_k3s.sh

    k3s_script_path: ""

    # ------------------------------------------------------------------
    # REGISTRY
    # ------------------------------------------------------------------
    registry_host: "ptdockreg.ad.speechpro.com:5000"
    registry_endpoint: "http://ptdockreg.ad.speechpro.com:5000"

    # ------------------------------------------------------------------
    # KUBECONFIG
    # ------------------------------------------------------------------
    local_kube_dir: "{{ lookup('env','HOME') }}/.kube"
    local_kubeconfig: "{{ local_kube_dir }}/{{ inventory_hostname }}.yaml"
    remote_kubeconfig: /etc/rancher/k3s/k3s.yaml
    node_ip: "{{ inventory_hostname }}"

  # ====================================================================
  # TASKS
  # ====================================================================
  tasks:

  # --------------------------------------------------------------------
  # UNINSTALL
  # --------------------------------------------------------------------
  - name: Uninstall K3s
    block:
      - name: Stop k3s
        service:
          name: k3s
          state: stopped
        ignore_errors: true

      - name: Run uninstall script
        command: /usr/local/bin/k3s-uninstall.sh
        ignore_errors: true

      - name: Remove k3s directories
        file:
          path: "{{ item }}"
          state: absent
        loop:
          - /etc/rancher
          - /var/lib/rancher
          - /var/lib/kubelet
          - /var/lib/cni
          - /var/log/k3s.log
        ignore_errors: true

      - name: Remove local kubeconfig
        delegate_to: localhost
        become: false
        file:
          path: "{{ local_kubeconfig }}"
          state: absent

      - debug:
          msg: "✅ K3s uninstalled on {{ inventory_hostname }}"

    tags: uninstall
    when: "'uninstall' in ansible_run_tags"

  # --------------------------------------------------------------------
  # STAGE K3S INSTALL SCRIPT
  # --------------------------------------------------------------------
  - name: Stage k3s install script (online → offline fallback)
    block:

      - name: Download k3s script (online)
        delegate_to: localhost
        become: false
        get_url:
          url: https://get.k3s.io
          dest: "{{ k3s_online_script_local }}"
          mode: "0755"

      - name: Copy online script to remote
        copy:
          src: "{{ k3s_online_script_local }}"
          dest: "{{ k3s_script_remote }}"
          mode: "0755"

      - set_fact:
          k3s_script_path: "{{ k3s_script_remote }}"

    rescue:

      - name: Check offline script exists
        delegate_to: localhost
        become: false
        stat:
          path: "{{ k3s_offline_script_local }}"
        register: offline_script

      - fail:
          msg: "❌ Offline k3s script not found"
        when: not offline_script.stat.exists

      - name: Copy offline script to remote
        copy:
          src: "{{ k3s_offline_script_local }}"
          dest: "{{ k3s_script_remote }}"
          mode: "0755"

      - set_fact:
          k3s_script_path: "{{ k3s_script_remote }}"

    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # --------------------------------------------------------------------
  # INSTALL HELM
  # --------------------------------------------------------------------
  - name: Install Helm
    block:
      - package:
          name: helm
          state: present
    rescue:
      - shell: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        args:
          creates: /usr/local/bin/helm
    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # --------------------------------------------------------------------
  # INSTALL K3S
  # --------------------------------------------------------------------
  - name: Install k3s
    command: "{{ k3s_script_path }}"
    args:
      creates: /usr/local/bin/k3s
    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # --------------------------------------------------------------------
  # REGISTRY CONFIG
  # --------------------------------------------------------------------
  - name: Configure HTTP registry
    block:
      - file:
          path: "/var/lib/rancher/k3s/agent/etc/containerd/certs.d/{{ registry_host }}"
          state: directory

      - copy:
          dest: "/var/lib/rancher/k3s/agent/etc/containerd/certs.d/{{ registry_host }}/hosts.toml"
          content: |
            server = "{{ registry_endpoint }}"

      - service:
          name: k3s
          state: restarted
    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # --------------------------------------------------------------------
  # KUBECONFIG
  # --------------------------------------------------------------------
  - name: Fetch kubeconfig
    block:
      - delegate_to: localhost
        become: false
        file:
          path: "{{ local_kube_dir }}"
          state: directory

      - fetch:
          src: "{{ remote_kubeconfig }}"
          dest: "{{ local_kubeconfig }}"
          flat: true

      - delegate_to: localhost
        become: false
        replace:
          path: "{{ local_kubeconfig }}"
          regexp: 'server: https://.*:6443'
          replace: "server: https://{{ node_ip }}:6443"

    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # --------------------------------------------------------------------
  # HELM CHARTS
  # --------------------------------------------------------------------
  - name: Install k8s-dashboard
    shell: |
      # Delete old resources if exist
      kubectl delete secret kubernetes-dashboard-csrf -n kube-system --ignore-not-found
      kubectl delete serviceaccount kubernetes-dashboard -n kube-system --ignore-not-found
      kubectl delete clusterrolebinding kubernetes-dashboard --ignore-not-found
      kubectl delete namespace kubernetes-dashboard --ignore-not-found

      # Create serviceaccount and clusterrolebinding
      kubectl create serviceaccount kubernetes-dashboard -n kube-system --dry-run=client -o yaml | kubectl apply -f -
      kubectl create clusterrolebinding kubernetes-dashboard \
        --clusterrole=cluster-admin \
        --serviceaccount=kube-system:kubernetes-dashboard \
        --dry-run=client -o yaml | kubectl apply -f -

      # Install/upgrade Helm chart
      helm upgrade --install {{ item }} ./{{ item }} --namespace kube-system --create-namespace
    args:
      chdir: "{{ playbook_dir }}/charts"
    environment:
      KUBECONFIG: "{{ local_kubeconfig }}"
    loop:
      - k8s-dashboard
    when: "'uninstall' not in ansible_run_tags"
    tags: charts
    delegate_to: localhost

  - name: Install common charts
    shell: |
      helm upgrade --install {{ item }} ./{{ item }} --create-namespace
    args:
      chdir: "{{ playbook_dir }}/charts"
    environment:
      KUBECONFIG: "{{ local_kubeconfig }}"
    loop:
      - traefik
      - grafana
      - prometheus
      - kube-state-metrics
      - vault
      - portainer
      - node-exporter
    when: "'uninstall' not in ansible_run_tags"
    tags: charts
    delegate_to: localhost

  # --------------------------------------------------------------------
  # FINAL INFO
  # --------------------------------------------------------------------
  - debug:
      msg:
        - "✅ K3s ready on {{ inventory_hostname }}"
        - "📦 Registry: {{ registry_host }}"
        - "📄 KUBECONFIG={{ local_kubeconfig }}"
    when: "'uninstall' not in ansible_run_tags"
