---
# =============================================================================
# Playbook: K3s lifecycle management
#
# Description:
#   Manages full K3s lifecycle:
#     - uninstall
#     - install (online with offline fallback)
#     - registry configuration
#     - kubeconfig handling
#     - Helm installation
#     - Helm chart deployment
#
# Usage:
#   ansible-playbook k3s.yml --tags install
#   ansible-playbook k3s.yml --tags uninstall
#   ansible-playbook k3s.yml --tags charts
# =============================================================================

- name: K3s lifecycle management (install / uninstall / charts)
  hosts: all
  gather_facts: true
  become: true

  # ---------------------------------------------------------------------------
  # Ask for sudo password explicitly
  # ---------------------------------------------------------------------------
  vars_prompt:
    - name: ansible_become_pass
      prompt: "Enter sudo password"
      private: true

  # ---------------------------------------------------------------------------
  # Use local connection for localhost, SSH otherwise
  # ---------------------------------------------------------------------------
  connection: "{{ 'local' if inventory_hostname in ['localhost','127.0.0.1'] else 'ssh' }}"

  vars:
    # =========================================================================
    # K3S INSTALL SCRIPTS
    # =========================================================================
    k3s_online_script_local: "{{ playbook_dir }}/scripts/k3s_online.sh"
    k3s_offline_script_local: "{{ playbook_dir }}/scripts/install_k3s.sh"
    k3s_script_remote: /usr/local/bin/install_k3s.sh

    k3s_write_kubeconfig_mode: "0640"
    k3s_write_kubeconfig_group: "k3s"

    # Will be dynamically set (online / offline)
    k3s_script_path: ""

    # =========================================================================
    # CONTAINER REGISTRY
    # =========================================================================
    registry_host: "ptdockreg.ad.speechpro.com:5000"
    registry_endpoint: "http://ptdockreg.ad.speechpro.com:5000"

    # =========================================================================
    # KUBECONFIG PATHS
    # =========================================================================
    local_kube_dir: "{{ lookup('env','HOME') }}/.kube"
    local_kubeconfig: "{{ local_kube_dir }}/{{ inventory_hostname }}.yaml"
    remote_kubeconfig: /etc/rancher/k3s/k3s.yaml

    # Node IP used in kubeconfig
    node_ip: "{{ inventory_hostname }}"

  tasks:

  # ===========================================================================
  # SAVE TARGET HOST
  # Used later for delegated tasks that still need original host context
  # ===========================================================================
  - name: Save target host for delegated tasks
    ansible.builtin.set_fact:
      target_host: "{{ inventory_hostname }}"

  # ===========================================================================
  # UNINSTALL K3S
  # Completely removes K3s and related data
  # ===========================================================================
  - name: Uninstall K3s
    block:

      - name: Stop k3s service if running
        ansible.builtin.service:
          name: k3s
          state: stopped
        ignore_errors: true

      - name: Run official uninstall script
        ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
        ignore_errors: true

      - name: Remove K3s directories and data
        ansible.builtin.file:
          path: "{{ item }}"
          state: absent
        loop:
          - /etc/rancher
          - /var/lib/rancher
          - /var/lib/kubelet
          - /var/lib/cni
          - /var/log/k3s.log
        ignore_errors: true

      - name: Remove local kubeconfig
        delegate_to: localhost
        become: false
        ansible.builtin.file:
          path: "{{ local_kubeconfig }}"
          state: absent

      - name: Uninstall completed
        ansible.builtin.debug:
          msg: "✅ K3s uninstalled on {{ inventory_hostname }}"

    tags: uninstall
    when: "'uninstall' in ansible_run_tags"

  # ===========================================================================
  # STAGE K3S INSTALL SCRIPT
  # Online download with offline fallback
  # ===========================================================================
  - name: Stage k3s install script (online → offline fallback)
    block:

    #   - name: Download official k3s install script (online)
    #     delegate_to: localhost
    #     become: false
    #     ansible.builtin.get_url:
    #       url: https://get.k3s.io
    #       dest: "{{ k3s_online_script_local }}"
    #       mode: "0755"

    #   - name: Copy online install script to target host
    #     ansible.builtin.copy:
    #       src: "{{ k3s_online_script_local }}"
    #       dest: "{{ k3s_script_remote }}"
    #       mode: "0755"

    #   - name: Set active k3s script path
    #     ansible.builtin.set_fact:
    #       k3s_script_path: "{{ k3s_script_remote }}"

    # rescue:

      - name: Check offline install script exists
        delegate_to: localhost
        become: false
        ansible.builtin.stat:
          path: "{{ k3s_offline_script_local }}"
        register: offline_script

      - name: Fail if offline script is missing
        ansible.builtin.fail:
          msg: "❌ Offline k3s script not found"
        when: not offline_script.stat.exists

      - name: Copy offline install script to target host
        ansible.builtin.copy:
          src: "{{ k3s_offline_script_local }}"
          dest: "{{ k3s_script_remote }}"
          mode: "0755"

      - name: Set active k3s script path
        ansible.builtin.set_fact:
          k3s_script_path: "{{ k3s_script_remote }}"

    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # ===========================================================================
  # HELM INSTALLATION
  # Installed both on remote nodes and localhost (for chart management)
  # ===========================================================================
  - name: Install Helm on target host
    block:
      - ansible.builtin.package:
          name: helm
          state: present
    rescue:
      - ansible.builtin.shell: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        args:
          creates: /usr/local/bin/helm
    when: "'uninstall' not in ansible_run_tags"
    tags: install

  - name: Install Helm on localhost
    block:
      - ansible.builtin.package:
          name: helm
          state: present
    rescue:
      - ansible.builtin.shell: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        args:
          creates: /usr/local/bin/helm
    when: "'uninstall' not in ansible_run_tags"
    tags: install
    delegate_to: localhost

  # ===========================================================================
  # INSTALL K3S
  # ===========================================================================
  - name: Install k3s on target host
    ansible.builtin.command: "{{ k3s_script_path }}"
    args:
      creates: /usr/local/bin/k3s
    environment:
      INSTALL_K3S_EXEC: >
        server
        --write-kubeconfig-mode {{ k3s_write_kubeconfig_mode }}
        --write-kubeconfig-group {{ k3s_write_kubeconfig_group }}
    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # Localhost install (offline / dev scenarios)
  - name: Install k3s on localhost (offline)
    ansible.builtin.command: "{{ k3s_offline_script_local }}"
    args:
      creates: /usr/local/bin/k3s
    when: "'uninstall' not in ansible_run_tags"
    tags: install
    delegate_to: localhost

  # ===========================================================================
  # CONTAINER REGISTRY CONFIGURATION
  # ===========================================================================
  - name: Configure HTTP container registry for containerd
    block:

      - name: Create registry config directory
        ansible.builtin.file:
          path: "/var/lib/rancher/k3s/agent/etc/containerd/certs.d/{{ registry_host }}"
          state: directory

      - name: Configure registry endpoint
        ansible.builtin.copy:
          dest: "/var/lib/rancher/k3s/agent/etc/containerd/certs.d/{{ registry_host }}/hosts.toml"
          content: |
            server = "{{ registry_endpoint }}"

      - name: Restart k3s to apply registry config
        ansible.builtin.service:
          name: k3s
          state: restarted

    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # ===========================================================================
  # KUBECONFIG FETCH AND PATCH
  # ===========================================================================
  - name: Fetch kubeconfig and adjust server address
    block:

      - name: Ensure local kube directory exists
        delegate_to: localhost
        become: false
        ansible.builtin.file:
          path: "{{ local_kube_dir }}"
          state: directory

      - name: Fetch kubeconfig from target host
        ansible.builtin.fetch:
          src: "{{ remote_kubeconfig }}"
          dest: "{{ local_kubeconfig }}"
          flat: true

      - name: Replace server address with node IP
        delegate_to: localhost
        become: false
        ansible.builtin.replace:
          path: "{{ local_kubeconfig }}"
          regexp: 'server: https://.*:6443'
          replace: "server: https://{{ node_ip }}:6443"

    when: "'uninstall' not in ansible_run_tags"
    tags: install

  # ===========================================================================
  # HELM CHART INSTALLATION
  # ===========================================================================
  - name: Install Kubernetes Dashboard
    shell: |
      kubectl delete namespace kubernetes-dashboard --ignore-not-found
      kubectl create serviceaccount kubernetes-dashboard -n kube-system --dry-run=client -o yaml | kubectl apply -f -
      kubectl create clusterrolebinding kubernetes-dashboard \
        --clusterrole=cluster-admin \
        --serviceaccount=kube-system:kubernetes-dashboard \
        --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install {{ item }} ./{{ item }} --namespace kube-system --create-namespace
    args:
      chdir: "{{ playbook_dir }}/charts"
    environment:
      KUBECONFIG: "{{ local_kubeconfig }}"
    loop:
      - k8s-dashboard
    when: "'uninstall' not in ansible_run_tags"
    tags: charts
    delegate_to: localhost

  # ===========================================================================
  # Install monitoring & infrastructure charts
  # ===========================================================================
  - name: Install Prometheus, Node Exporter, Traefik, Grafana, Kube State Metrics
    shell: |
      helm upgrade --install {{ item }} ./{{ item }} --namespace kube-system --create-namespace
    args:
      chdir: "{{ playbook_dir }}/charts"
    environment:
      KUBECONFIG: "{{ local_kubeconfig }}"
    loop:
      - prometheus
      - node-exporter
      - traefik
      - grafana
      - kube-state-metrics
      - influxdb
    when: "'uninstall' not in ansible_run_tags"
    tags: charts
    delegate_to: localhost

  - name: Install portainer
    shell: |
      kubectl delete namespace portainer --ignore-not-found
      kubectl create serviceaccount portainer -n kube-system --dry-run=client -o yaml | kubectl apply -f -
      kubectl create clusterrolebinding portainer \
        --clusterrole=cluster-admin \
        --serviceaccount=kube-system:portainer-sa \
        --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install {{ item }} ./{{ item }} --namespace kube-system --create-namespace
    args:
      chdir: "{{ playbook_dir }}/charts"
    environment:
      KUBECONFIG: "{{ local_kubeconfig }}"
    loop:
      - portainer
    when: "'uninstall' not in ansible_run_tags"
    tags: charts
    delegate_to: localhost

  # ===========================================================================
  # Install common charts (e.g., Vault)
  # ===========================================================================
  - name: Install common charts
    shell: |
      helm upgrade --install {{ item }} ./{{ item }} --create-namespace
    args:
      chdir: "{{ playbook_dir }}/charts"
    environment:
      KUBECONFIG: "{{ local_kubeconfig }}"
    loop:
      - vault
    when: "'uninstall' not in ansible_run_tags"
    tags: charts
    delegate_to: localhost

  # ===========================================================================
  # Parse ingress hosts from charts values.yaml
  # This builds a list of hosts for /etc/hosts or inventory purposes
  # ===========================================================================
  - name: Find all values.yaml files in charts directory
    ansible.builtin.find:
      paths: charts
      patterns: values.yaml
      recurse: true
    register: values_files
    delegate_to: localhost
    run_once: true

  - name: Parse ingress hosts from values.yaml
    ansible.builtin.set_fact:
      parsed_hosts: >-
        {{
          parsed_hosts | default([]) +
          (
            (
              lookup('file', item.path)
              | from_yaml
              | json_query('ingress.hosts[].host')
            ) | default([])
          )
        }}
    loop: "{{ values_files.files }}"
    delegate_to: localhost
    run_once: true
    when:
      - lookup('file', item.path) | from_yaml | json_query('ingress.hosts') is not none

  # ===========================================================================
  # ENABLE KUBECTL WITHOUT SUDO
  # ===========================================================================
  - name: Enable kubectl access without sudo
    block:

      - name: Ensure k3s group exists
        ansible.builtin.group:
          name: k3s
          state: present

      - name: Add user to k3s group
        ansible.builtin.user:
          name: "{{ ansible_user_id }}"
          groups: k3s
          append: true

      - name: Create .kube directory for user
        ansible.builtin.file:
          path: "/home/{{ ansible_user_id }}/.kube"
          state: directory
          owner: "{{ ansible_user_id }}"
          group: "{{ ansible_user_id }}"
          mode: "0755"

      - name: Copy kubeconfig to user home
        ansible.builtin.copy:
          src: /etc/rancher/k3s/k3s.yaml
          dest: "/home/{{ ansible_user_id }}/.kube/config"
          remote_src: true
          owner: "{{ ansible_user_id }}"
          group: "{{ ansible_user_id }}"
          mode: "0644"

      - name: Replace server address in kubeconfig
        ansible.builtin.replace:
          path: "/home/{{ ansible_user_id }}/.kube/config"
          regexp: 'server: https://.*:6443'
          replace: "server: https://{{ node_ip }}:6443"

      - name: Export KUBECONFIG in user's bashrc
        ansible.builtin.lineinfile:
          path: "/home/{{ ansible_user_id }}/.bashrc"
          line: 'export KUBECONFIG=$HOME/.kube/config'
          create: true

    when: "'uninstall' not in ansible_run_tags"
    tags:
      - install
      - kubeconfig

  # ===========================================================================
  # BUILD HOSTS ENTRIES
  # Useful for dynamic /etc/hosts updates or inventory generation
  # ===========================================================================
  - name: Build hosts entries
    ansible.builtin.set_fact:
      hosts_entries: >-
        {{
          parsed_hosts
          | unique
          | map('regex_replace', '^',
              hostvars[target_host].ansible_host
              | default(target_host)
              ~ ' ')
          | list
        }}
    delegate_to: localhost
    run_once: true

  # ===========================================================================
  # FINAL INFORMATION / DEBUG
  # ===========================================================================
  - name: Show final K3s setup information
    ansible.builtin.debug:
      msg:
        - "✅ K3s ready on {{ inventory_hostname }}"
        - "📦 Registry: {{ registry_host }}"
        - "📄 KUBECONFIG={{ local_kubeconfig }}"
    when: "'uninstall' not in ansible_run_tags"

  - name: Show parsed hosts entries
    ansible.builtin.debug:
      msg: "{{ hosts_entries }}"
    run_once: true

