apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasource   # <- должно совпадать с Deployment
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.prometheus.url | quote }}
        isDefault: true
