apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard   # <- должно совпадать с Deployment
  labels:
    grafana_dashboard: "1"
data:
  cluster-metrics.json: |
    {
      "id": null,
      "title": "Cluster Metrics",
      "panels": [
        {
          "type": "graph",
          "title": "CPU Usage",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total[1m])) by (instance)",
              "legendFormat": "{{`{{instance}}`}}"
            }
          ],
          "gridPos": {"x":0,"y":0,"w":12,"h":6}
        },
        {
          "type": "graph",
          "title": "Memory Usage",
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes) by (instance)",
              "legendFormat": "{{`{{instance}}`}}"
            }
          ],
          "gridPos": {"x":0,"y":6,"w":12,"h":6}
        }
      ],
      "schemaVersion": 16,
      "version": 1,
      "refresh": "15s"
    }
