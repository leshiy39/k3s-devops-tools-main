apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      containers:
        - name: kube-state-metrics
          image: kubesphere/kube-state-metrics:v2.15.0
          args:
            - --port=8780
            - --telemetry-port=8780
          ports:
            - containerPort: 8780
