apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      serviceAccountName: portainer-sa
      containers:
        - name: portainer
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: portainer-data
              mountPath: /data
          resources:
{{- toYaml .Values.resources | nindent 12 }}
      volumes:
{{- if .Values.persistence.enabled }}
        - name: portainer-data
          persistentVolumeClaim:
            claimName: portainer-pvc
{{- else }}
        - name: portainer-data
          emptyDir: {}
{{- end }}
