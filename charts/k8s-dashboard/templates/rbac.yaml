apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-dashboard
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
    resourceNames:
      - kubernetes-dashboard-csrf
    verbs:
      - get
      - update
      - delete
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-dashboard
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: kubernetes-dashboard
    namespace: kube-system
roleRef:
  kind: Role
  name: kubernetes-dashboard
  apiGroup: rbac.authorization.k8s.io