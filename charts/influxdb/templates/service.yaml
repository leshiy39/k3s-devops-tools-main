apiVersion: v1
kind: Service
metadata:
  name: influxdb
  labels:
    app: influxdb
spec:
  type: {{ .Values.influxdb.service.type }}
  selector:
    app: influxdb
  ports:
    - port: {{ .Values.influxdb.service.port }}
      targetPort: 8086
      nodePort: {{ .Values.influxdb.service.nodePort }}
