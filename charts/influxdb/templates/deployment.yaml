apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  labels:
    app: influxdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: {{ .Values.influxdb.image }}
          ports:
            - containerPort: 8086
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "{{ .Values.influxdb.init.mode }}"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "{{ .Values.influxdb.init.username }}"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: "{{ .Values.influxdb.init.password }}"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "{{ .Values.influxdb.init.org }}"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "{{ .Values.influxdb.init.bucket }}"
            - name: DOCKER_INFLUXDB_INIT_RETENTION
              value: "{{ .Values.influxdb.init.retention }}"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              value: "{{ .Values.influxdb.init.adminToken }}"
